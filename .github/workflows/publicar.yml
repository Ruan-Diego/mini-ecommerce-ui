name: Publicar pacotes

# ADR-0004: nunca dispara em push nem em dev/feat. Roda quando uma release é publicada
# (criada a partir da main, no fim de uma fase) ou manualmente, e só a partir da main ou de uma tag.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@ruan-diego"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Publica só os pacotes cuja versão ainda não existe no registry.
      - run: pnpm exec changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
